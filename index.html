<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مكتب الموارد البشرية - Jaz Aquamarine</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f2f8fc;
      color: #222;
      padding: 20px;
      text-align: right;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      color: #0074a8;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
      margin: 20px 0;
    }
    .qr {
      text-align: center;
      margin-top: 30px;
    }
    .qr-img {
      width: 180px;
      height: 180px;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>مرحبًا بكم في مكتب الموارد البشرية بفندق جاز أكوا مارين</h1>
    <p>يرجى مراجعة مصوغات التعيين بالصورة التالية:</p>

    <!-- ✅ صورة مصوغات التعيين -->
    <h2>📄 مصوغات التعيين:</h2>
    <img src="https://ahme814.github.io/HR-Jaz-Aquamarine/requirements.jpg" alt="مصوغات التعيين">

    <!-- ✅ QR Code -->
    <div class="qr">
      <h2>📱 امسح QR لفتح الصفحة على موبايلك</h2>
      <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://ahme814.github.io/HR-Jaz-Aquamarine/" alt="QR Code">
    </div>

  </div>
</body>
</html>
